name: Build & quality

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.13.2). Leave empty to use the latest tag.'
        required: false
        type: string

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: CRLF tests
        run: npm run test:crlf

      - name: Build
        run: npm run build

      - name: Start Xvfb
        run: |
          /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 1

      - name: E2E tests
        env:
          DISPLAY: ':99'
        run: npm run test:e2e

      - name: Custom table visual regression tests
        env:
          DISPLAY: ':99'
        run: npm run test:e2e:visual

  cd-ovsx:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to OpenVSX
        run: npx ovsx publish dist/extension.vsix --pat ${{ secrets.OPENVSX_TOKEN }}

  cd-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Extract version from tag
        id: tag_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG=$(git describe --tags --abbrev=0)
            fi
            VERSION=${TAG#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          if [ -f CHANGELOG.md ]; then
            ESCAPED_VERSION=$(printf '%s\n' "$VERSION" | sed 's/[[\.*^$()+?{|]/\\&/g')
            awk -v version="$ESCAPED_VERSION" '
              BEGIN { found=0 }
              /^## \[/ && found { exit }
              /^## \[/ && $0 ~ "\\[" version "\\]" { found=1; next }
              found { print }
            ' CHANGELOG.md > release_notes.txt || true
            if [ -s release_notes.txt ]; then
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              cat release_notes.txt >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "notes=No changelog entry found for version $VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "notes=Changelog file not found" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/extension.vsix
          tag_name: ${{ steps.tag_version.outputs.TAG }}
          name: Release ${{ steps.tag_version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            **View full changelog**: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.tag_version.outputs.TAG }}/CHANGELOG.md)
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
